name: Orchestrate AzzaVision-AI (Signal + Panel)

# Orkestrator pusat: Hermes-ondemand men-trigger repo Azza-Vision-AI (Pterodactyl
# panel keep-alive) dan menjaga channel sinyal tetap "hidup" (update/notifikasi).
#
# Azza-Vision-AI punya logika & workflow-nya sendiri (deploy-pterodactyl.yml).
# Hermes hanya MELENGKAPI channel sinyal agar rapi, pro, dan hidup — bukan
# menggantikan logika panel.
#
# Design:
#   - Schedule: 6 jam (sinkron dengan cron Azza-Vision-AI) sebagai cadangan.
#   - workflow_dispatch manual: trigger AzzaVision + kirim notif ke channel.
#   - Concurrency di repo Azza-Vision-AI (group pterodactyl-panel) mencegah dua
#     panel bertabrakan; di sini kita hanya "pastikan sudah aktif", bukan re-trigger
#     yang bisa menumpuk.

on:
  schedule:
    # Cadangan: pastikan panel AzzaVision aktif setiap 6 jam
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Override chat_id channel sinyal (default: secret SIGNAL_CHAT_ID)"
        required: false
        default: ""
      notify_only:
        description: "Hanya kirim notif ke channel, tanpa trigger panel (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine channel
        id: chan
        env:
          SIGNAL_CHAT_ID: ${{ secrets.SIGNAL_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_CHAT_ID: ${{ inputs.chat_id }}
        run: |
          CHAT="${INPUT_CHAT_ID:-${SIGNAL_CHAT_ID:-$TELEGRAM_CHAT_ID}}"
          echo "chat_id=${CHAT}" >> "$GITHUB_OUTPUT"
          echo "Using channel chat_id: ${CHAT}"

      - name: Trigger AzzaVision panel (deploy-pterodactyl.yml)
        if: inputs.notify_only != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          REPO="azascloud-cell/Azza-Vision-AI"
          WF="deploy-pterodactyl.yml"
          echo "Triggering ${REPO}/${WF} ..."
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/${WF}/dispatches" \
            -d '{"ref":"main"}')
          CODE=$(echo "$RESP" | tail -n1)
          echo "HTTP $CODE"
          if [ "$CODE" = "204" ]; then
            echo "TRIGGER=ok" >> "$GITHUB_ENV"
            echo "✅ Panel AzzaVision di-trigger (idempotent via concurrency repo tujuan)."
          else
            echo "TRIGGER=warn" >> "$GITHUB_ENV"
            echo "⚠️ Trigger tidak 204 (mungkin sudah ada run aktif / token scope). Non-fatal."
          fi

      - name: Notify channel (panel status + jadwal sinyal)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ steps.chan.outputs.chat_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$CHAT_ID" ] || [ "$CHAT_ID" = "" ]; then
            echo "Token/chat kosong — skip notif"
            exit 0
          fi
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          TRIGGER_STATE="${TRIGGER:-ok}"
          MSG="🟢 **AzzaVision AI — Orchestrator aktif**%0A━━━━━━━━━━━━━━━━━━━━%0A📡 Panel: ${TRIGGER_STATE}%0A⏰ Waktu: ${NOW}%0A💬 Hermes mendampingi channel sinyal (XAUUSD alerts siap)."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${MSG}" >/dev/null 2>&1 || true
          echo "Notif dikirim ke ${CHAT_ID}"