name: Hermes On-Demand

on:
  repository_dispatch:
    types: [hermes-on-demand]

jobs:
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          hermes --version || hermes setup --help || true

      - name: Configure Hermes (Ollama Cloud + Groq fallback)
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_CLOUD_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p ~/.hermes
          cat > ~/.hermes/.env <<EOF
          OLLAMA_API_KEY=${OLLAMA_API_KEY}
          OLLAMA_CLOUD_API_KEY=${OLLAMA_CLOUD_API_KEY}
          GROQ_API_KEY=${GROQ_API_KEY}
          EOF
          cat > ~/.hermes/config.yaml <<EOF
          model:
            provider: "ollama-cloud"
            default: "gemma4:31b-cloud"
            base_url: "https://ollama.com/v1"
          fallback_providers:
            - provider: "ollama-cloud"
              model: "gemma4:31b-cloud"
          providers:
            groq:
              api: "https://api.groq.com/openai/v1"
              api_key: "\${GROQ_API_KEY}"
              models:
                llama-3.3-70b-versatile:
                  context_length: 131072
                llama-3.1-8b-instant:
                  context_length: 131072
                qwen/qwen3-32b:
                  context_length: 131072
                openai/gpt-oss-120b:
                  context_length: 131072
                moonshotai/kimi-k2-instruct:
                  context_length: 131072
          EOF

      - name: Run Hermes on question
        id: hermes
        env:
          QUESTION: ${{ github.event.client_payload.question }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Save answer
          hermes chat -q "$QUESTION" > answer.txt 2>&1 || true
          echo "Answer length: $(wc -c < answer.txt)"
          # Export as base64-safe content for the reply step
          python - <<'PY'
          import base64, json
          with open("answer.txt", "r", errors="replace") as f:
              content = f.read()
          with open("answer_b64.txt", "w") as f:
              f.write(base64.b64encode(content.encode("utf-8")).decode())
          PY

      - name: Reply to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          python - <<'PY'
          import os, base64, urllib.request, urllib.parse, json
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ.get("CHAT_ID", "").strip()
          # Skip silently when no valid chat id was supplied (e.g. test dispatch).
          if not chat_id or chat_id == "0":
              print("No valid chat_id; skipping reply")
              raise SystemExit(0)
          with open("answer_b64.txt") as f:
              text = base64.b64decode(f.read()).decode("utf-8", "replace")
          # Telegram caps messages at 4096 chars; trim
          text = text[:4000]
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
          req = urllib.request.Request(url, data=payload)
          try:
              resp = urllib.request.urlopen(req)
              print("Sent:", resp.status)
          except Exception as e:
              print("Failed to send:", e)
              # Reply failure is non-fatal: the answer already exists in logs/artifacts.
              raise SystemExit(0)
          PY

      - name: Upload answer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-answer
          path: answer.txt
          if-no-files-found: warn