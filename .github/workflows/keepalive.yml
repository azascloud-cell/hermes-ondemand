name: Hermes Keep-Alive 24/7

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Job runtime in minutes (max 355)"
        required: false
        default: "350"
        type: number
  schedule:
    # Fallback cron: triggers a fresh run roughly every 6h so the bot never
    # stays down if a keep-alive dispatch fails.
    - cron: "0 */6 * * *"

concurrency:
  group: hermes-gateway
  cancel-in-progress: false

jobs:
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 356
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash -s -- --skip-setup --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.hermes/bin" >> "$GITHUB_PATH"
          echo "installed; checking:"
          ls -la "$HOME/.hermes/bin" 2>/dev/null || true
          ls -la "$HOME/.local/bin" 2>/dev/null || true

      - name: Configure Hermes (Ollama Cloud)
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p ~/.hermes
          cat > ~/.hermes/.env <<EOF
          OLLAMA_API_KEY=${OLLAMA_API_KEY}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
          EOF
          cat > ~/.hermes/config.yaml <<EOF
          model:
            provider: "ollama-cloud"
            default: "gemma4:31b-cloud"
            base_url: "https://ollama.com/v1"
          EOF

      - name: Pin python-telegram-bot 22.6 (fix Any cannot be instantiated)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Hermes installs into ~/.hermes/hermes-agent with a managed uv venv
          VENV_PY="$(ls -d $HOME/.hermes/hermes-agent/.venv/bin/python 2>/dev/null || ls -d $HOME/.hermes/hermes-agent/venv/bin/python 2>/dev/null || echo '')"
          echo "venv python: $VENV_PY"
          if [ -n "$VENV_PY" ]; then
            "$VENV_PY" -m pip install -q "python-telegram-bot[webhooks]==22.6" 2>&1 | tail -5 || true
          else
            echo "venv not found; trying hermes gateway install path"
            hermes gateway install --help >/dev/null 2>&1 || true
          fi
          echo "pin done"

      - name: Run Keep-Alive Gateway
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
          RUN_MINUTES: ${{ inputs.minutes || 350 }}
          KEEPALIVE_WORKFLOW: "keepalive.yml"
        run: |
          chmod +x scripts/keepalive.sh
          ./scripts/keepalive.sh