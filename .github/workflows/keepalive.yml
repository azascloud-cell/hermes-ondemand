name: Hermes Keep-Alive 24/7

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Job runtime in minutes (max 355)"
        required: false
        default: "350"
        type: number
  schedule:
    # Fallback cron: triggers a fresh run roughly every 6h so the bot never
    # stays down if a keep-alive dispatch fails.
    - cron: "0 */6 * * *"

concurrency:
  group: hermes-gateway
  cancel-in-progress: false

jobs:
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 356
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hermes Agent
        run: |
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash -s -- --skip-setup --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.hermes/bin" >> "$GITHUB_PATH"
          echo "installed; checking:"
          ls -la "$HOME/.hermes/bin" 2>/dev/null || true
          ls -la "$HOME/.local/bin" 2>/dev/null || true

      - name: Configure Hermes (Ollama Cloud + Groq fallback)
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_CLOUD_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p ~/.hermes
          cat > ~/.hermes/.env <<EOF
          OLLAMA_API_KEY=${OLLAMA_API_KEY}
          OLLAMA_CLOUD_API_KEY=${OLLAMA_CLOUD_API_KEY}
          GROQ_API_KEY=${GROQ_API_KEY}
          OPENCODE_ZEN_API_KEY=${OPENCODE_ZEN_API_KEY}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
          EOF
          cat > ~/.hermes/config.yaml <<EOF
          model:
            provider: "opencode-zen"
            default: "deepseek-v4-flash-free"
            base_url: "https://opencode.ai/zen/v1"
          EOF

      - name: Pin python-telegram-bot 22.6 (fix Any cannot be instantiated)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Hermes installs into ~/.hermes/hermes-agent with venv + managed uv.
          # MUST use `uv pip` (the venv's pip is forced to --user and fails).
          UV="$HOME/.hermes/bin/uv"
          VENV_PY="$(ls -d $HOME/.hermes/hermes-agent/venv/bin/python 2>/dev/null || echo '')"
          echo "uv: $UV | venv python: $VENV_PY"
          if [ -n "$VENV_PY" ] && [ -x "$UV" ]; then
            "$UV" pip install --python "$VENV_PY" --reinstall "python-telegram-bot[webhooks]==22.6"
            echo "=== pinned PTB version ==="
            "$UV" pip list --python "$VENV_PY" | grep -i python-telegram
            "$VENV_PY" -c "import python_telegram_bot as p; print('PTB import ok:', p.__version__)" || true
          else
            echo "venv or uv not found; cannot pin"
            exit 1
          fi

      - name: Patch Telegram TypeHandler restoration (fix Any cannot be instantiated)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ADAPTER="$HOME/.hermes/hermes-agent/plugins/platforms/telegram/adapter.py"
          echo "patching: $ADAPTER"
          # Fix from NousResearch/hermes-agent#85421: check_telegram_requirements()
          # never re-imports/restores TypeHandler, leaving it as typing.Any and
          # crashing at startup ("Any cannot be instantiated").
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path(os.environ["HOME"]) / ".hermes/hermes-agent/plugins/platforms/telegram/adapter.py"
          src = p.read_text()
          if "TypeHandler as _TH" in src:
              print("already patched")
              raise SystemExit(0)
          old = "            MessageHandler as _MH,\n            ContextTypes as _CT, filters as _filters,\n        )"
          new = "            MessageHandler as _MH,\n            ContextTypes as _CT, TypeHandler as _TH, filters as _filters,\n        )"
          if old not in src:
              print("pattern not found; aborting")
              raise SystemExit(1)
          src = src.replace(old, new)
          old2 = "    TelegramMessageHandler = _MH\n    ContextTypes = _CT\n    filters = _filters"
          new2 = "    TelegramMessageHandler = _MH\n    TypeHandler = _TH\n    ContextTypes = _CT\n    filters = _filters"
          if old2 not in src:
              print("restoration pattern not found; aborting")
              raise SystemExit(1)
          src = src.replace(old2, new2)
          old3 = "    global CommandHandler, CallbackQueryHandler, TelegramMessageHandler\n    global ContextTypes, filters, ParseMode, ChatType, HTTPXRequest"
          new3 = "    global CommandHandler, CallbackQueryHandler, TelegramMessageHandler, TypeHandler\n    global ContextTypes, filters, ParseMode, ChatType, HTTPXRequest"
          if old3 in src:
              src = src.replace(old3, new3)
          p.write_text(src)
          print("patched TypeHandler restoration")
          PY
          # sanity: confirm edit
          grep -n "TypeHandler as _TH\|TypeHandler = _TH" "$ADAPTER" | head

      - name: Run Keep-Alive Gateway
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_CLOUD_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
          RUN_MINUTES: ${{ inputs.minutes || 350 }}
          KEEPALIVE_WORKFLOW: "keepalive.yml"
          DATA_BRANCH: "data"
          BACKUP_EVERY_SEC: "300"
        run: |
          chmod +x scripts/keepalive.sh scripts/persist.sh scripts/selfheal.sh
          ./scripts/keepalive.sh